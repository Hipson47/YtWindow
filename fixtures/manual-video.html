<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Native PiP Manual Fixture</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        color: #171717;
        background: #f5f5f5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 16px;
        max-width: 960px;
      }

      video {
        width: 100%;
        max-width: 840px;
        background: #111;
      }

      .secondary {
        max-width: 280px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Native PiP Manual Fixture</h1>
      <video id="primary" controls muted autoplay playsinline></video>
      <video id="secondary" class="secondary" controls muted autoplay playsinline></video>
    </main>

    <script>
      function attachCanvasStream(video, label, color) {
        const canvas = document.createElement("canvas");
        canvas.width = 1280;
        canvas.height = 720;
        const context = canvas.getContext("2d");
        let frame = 0;

        function draw() {
          context.fillStyle = color;
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.fillStyle = "#fff";
          context.font = "72px system-ui, sans-serif";
          context.fillText(label, 80, 160);
          context.font = "36px system-ui, sans-serif";
          context.fillText(`Frame ${frame++}`, 80, 240);
          requestAnimationFrame(draw);
        }

        draw();
        video.srcObject = canvas.captureStream(30);
        video.play().catch(() => {});
      }

      attachCanvasStream(document.getElementById("primary"), "Primary test video", "#176b87");
      attachCanvasStream(document.getElementById("secondary"), "Secondary", "#7d3c98");
    </script>
  </body>
</html>
